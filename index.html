<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>telnet curriculum.pablorblanco.dev</title>
<meta name="description" content="CV de Pablo R. Blanco servido como una sesión telnet. whoami, traceroute y ping incluidos." />
<style>
  :root{
    --bg:#020a02;
    --bg-soft:#031203;
    --green:#33ff66;
    --green-dim:#1f9c3f;
    --green-bright:#9dffb0;
    --amber:#ffcf4d;
    --cyan:#5ad7ff;
    --red:#ff5f56;
    --muted:#3d7a4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#000;
    font-family:'SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;
    color:var(--green);
    overflow:hidden;
    font-size:15px;
    line-height:1.55;
  }

  /* CRT shell */
  #screen{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at center, var(--bg-soft) 0%, var(--bg) 70%, #000 100%);
    padding:28px 22px 64px;
    overflow-y:auto;
    text-shadow:0 0 4px rgba(51,255,102,.45);
    cursor:text;
  }
  #screen::-webkit-scrollbar{width:10px;}
  #screen::-webkit-scrollbar-thumb{background:var(--green-dim);border-radius:6px;}

  /* scanlines + flicker overlays */
  #screen::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.28) 3px,
      rgba(0,0,0,.28) 4px);
    pointer-events:none;
    z-index:50;
  }
  #screen::after{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
    z-index:51;
    animation:flicker .15s infinite;
  }
  @keyframes flicker{ 0%{opacity:.96;} 50%{opacity:1;} 100%{opacity:.97;} }

  #out{ white-space:pre-wrap; word-break:break-word; }

  .line{ white-space:pre-wrap; }
  .dim{ color:var(--muted); }
  .amber{ color:var(--amber); text-shadow:0 0 4px rgba(255,207,77,.5); }
  .cyan{ color:var(--cyan); text-shadow:0 0 4px rgba(90,215,255,.5); }
  .red{ color:var(--red); text-shadow:0 0 4px rgba(255,95,86,.5); }
  .bright{ color:var(--green-bright); }
  .bold{ font-weight:700; }
  a{ color:var(--cyan); text-decoration:none; border-bottom:1px dotted var(--cyan); }
  a:hover{ background:var(--cyan); color:#000; text-shadow:none; }

  .prompt-host{ color:var(--green-bright); }
  .prompt-sym{ color:var(--amber); }

  /* input line */
  #inputline{ display:flex; align-items:center; flex-wrap:wrap; }
  #ps1{ color:var(--green-bright); white-space:pre; }
  #cmd{
    flex:1 1 120px;
    min-width:60px;
    background:transparent;
    border:none;
    outline:none;
    color:var(--green-bright);
    font:inherit;
    text-shadow:inherit;
    caret-color:transparent;
  }
  #caret{
    display:inline-block;
    width:9px; height:1.05em;
    background:var(--green-bright);
    box-shadow:0 0 6px var(--green-bright);
    margin-left:-2px;
    vertical-align:bottom;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{opacity:0;} }
  #inputline.hidden{ display:none; }

  .barfull{ color:var(--green); }
  .barempty{ color:var(--muted); }

  @media (max-width:600px){
    body{ font-size:12px; }
    #screen{ padding:16px 12px 56px; }
  }
</style>
</head>
<body>
<div id="screen">
  <div id="out"></div>
  <div id="inputline" class="hidden">
    <span id="ps1"></span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal" />
    <span id="caret"></span>
  </div>
</div>

<script>
/* ============================================================
   CV de Pablo R. Blanco — servido como sesión telnet
   Un único archivo. Sin dependencias.
   ============================================================ */

const HOST = "curriculum.pablorblanco.dev";
const USER = "pablo";
const PS1  = `pablo.amador@gmail.com:~$ `;

const out   = document.getElementById("out");
const screen= document.getElementById("screen");
const inputline = document.getElementById("inputline");
const ps1el = document.getElementById("ps1");
const cmd   = document.getElementById("cmd");

ps1el.textContent = PS1;

let history = [];
let histIdx = -1;
let booted  = false;

/* ---------- helpers de escritura ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function print(html=""){
  const div = document.createElement("div");
  div.className = "line";
  div.innerHTML = html;
  out.appendChild(div);
  scrollDown();
}
function scrollDown(){ screen.scrollTop = screen.scrollHeight; }

const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* imprime una línea con efecto de tecleo */
async function type(html, speed=14){
  const div = document.createElement("div");
  div.className = "line";
  out.appendChild(div);
  // tecleamos sobre el texto plano, conservando etiquetas simples al final
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const text = tmp.textContent;
  for(let i=0;i<text.length;i++){
    div.textContent = text.slice(0,i+1);
    scrollDown();
    if(text[i] !== " ") await sleep(speed);
  }
  div.innerHTML = html; // restaura color/estilos al terminar
  scrollDown();
}

/* barra de progreso animada */
async function progress(label, ms=900){
  const div = document.createElement("div");
  div.className = "line";
  out.appendChild(div);
  const steps = 24;
  for(let i=0;i<=steps;i++){
    const full = "█".repeat(i);
    const empty= "░".repeat(steps-i);
    const pct = String(Math.round(i/steps*100)).padStart(3," ");
    div.innerHTML = `${label} <span class="barfull">${full}</span><span class="barempty">${empty}</span> ${pct}%`;
    scrollDown();
    await sleep(ms/steps);
  }
}

/* ---------- contenido del CV ---------- */

const ABOUT = [
  `<span class="dim">// identidad verificada</span>`,
  ``,
  `   <span class="bright bold">Pablo R. Blanco</span>  <span class="dim">— uid=1000(pablo) gid=1000(tech)</span>`,
  `   <span class="amber">Estrategia IA · Business Intelligence · Automatización</span>`,
  ``,
  `   Más de <span class="bright">26 años</span> dedicados a la tecnología en telecomunicaciones.`,
  `   Empecé instalando redes y escribiendo scripts para visualizar`,
  `   alarmas en la red GSM. Hoy diseño estrategia de mercado B2B`,
  `   impulsada por inteligencia artificial.`,
  ``,
  `   En el camino aprendí algo fundamental:`,
  `     <span class="cyan">» la tecnología sin propósito de negocio no sirve.</span>`,
  `     <span class="cyan">» y el negocio sin tecnología se queda atrás.</span>`,
  ``,
  `   Mi valor está en entender ambos lados y construir el puente.`,
  ``,
  `   <span class="bright bold">No me preguntéis qué sé hacer. Decidme qué necesitáis y lo haré.</span>`,
  ``,
  `   <span class="dim">groups : IA · BI · Automatización · Telco-B2B</span>`,

// Cada puesto = un salto (hop) del traceroute
const HOPS = [
  { host:"kakarot-software.lan",      ip:"10.0.0.1",   date:"1997–1999", role:"Cofundador · Programador",            ms:[1,2,2],    note:"Software a medida, redes y formación (Gerencia de Urbanismo, Sevilla)" },
  { host:"supercable.telco.es",       ip:"10.0.1.4",   date:"1999–2000", role:"Técnico de Incidencias",              ms:[3,4,5],    note:"Provisión de servicios y coordinación con el CGR" },
  { host:"orange.net.gsm",            ip:"10.0.2.7",   date:"2000–2004", role:"Técnico Supervisor de Red",           ms:[6,7,8],    note:"Red GSM/GPRS, alarmas y estado de nodos" },
  { host:"orange.b2b.support",        ip:"10.0.3.11",  date:"2004–2009", role:"Gestor Soporte Comercial",            ms:[9,11,12],  note:"Incidencias técnicas y análisis de riesgo (clientes empresa)" },
  { host:"orange.contracts.mgmt",     ip:"10.0.4.18",  date:"2010–2012", role:"Gestión de Contratos",                ms:[13,14,15], note:"Cuadro de mando, KPIs y web interdepartamental" },
  { host:"orange.bi.analytics",       ip:"10.0.5.22",  date:"2012–now",  role:"Desarrollo de Negocio · BI",          ms:[17,18,19], note:"Forecasting, series temporales, ETL y scripting" },
  { host:"orange.ai.automation",      ip:"10.0.6.26",  date:"2025–now",  role:"IA & Automatización de Procesos",     ms:[21,23,24], note:"Datos → decisiones con LLMs y agentes IA" },
];

const SKILLS = {
  "IA & LLMs"            : ["Claude Code","LLMs locales","Agentes IA","Prompt Engineering"],
  "Data & Analytics"    : ["Python · SPSS","SAS · SAS Macro","BigQuery · SQL","Series temporales · Forecasting"],
  "Business Intelligence":["QlikView","SAP Business Objects","ETL","KPIs & Reporting"],
  "Desarrollo & Script" : ["VBA · AutoIt","ASP.NET · Scripting","SQL (SQLite)","Protocolos de Internet"],
  "Sector & Dominio"    : ["Telecomunicaciones B2B","Estrategia de mercado","Transformación digital","GSM/GPRS · VoIP"],
};

/* ---------- comandos ---------- */

async function cmd_whoami(){
  for(const l of ABOUT) print(l);
}

async function cmd_traceroute(arg){
  const target = "PABLO-R-BLANCO.career";
  print(`traceroute to <span class="bright">${target}</span> (26.0.0.1), 30 hops max, 60 byte packets`);
  print(`<span class="dim">trazando el camino profesional...</span>`);
  print(``);
  let hop = 1;
  for(const h of HOPS){
    const div = document.createElement("div");
    div.className = "line";
    out.appendChild(div);
    const n = String(hop).padStart(2," ");
    // simulamos los 3 pings de cada salto
    let times = "";
    for(const t of h.ms){
      div.innerHTML =
        ` ${n}  <span class="cyan">${h.host.padEnd(24," ")}</span>` +
        `<span class="dim">(${h.ip})</span>  ${times}<span class="dim">*</span>`;
      scrollDown();
      await sleep(110);
      times += `<span class="amber">${t.toFixed(3)} ms</span>  `;
      div.innerHTML =
        ` ${n}  <span class="cyan">${h.host.padEnd(24," ")}</span>` +
        `<span class="dim">(${h.ip})</span>  ${times}`;
      scrollDown();
    }
    print(`     <span class="bright bold">${h.role}</span>  <span class="dim">[${h.date}]</span>`);
    print(`     <span class="dim">${h.note}</span>`);
    print(``);
    hop++;
  }
  print(`<span class="bright">Trace complete.</span>  <span class="amber">7 saltos</span> · <span class="amber">26 años</span> · destino alcanzado ✓`);
  print(`<span class="dim">El último salto sigue activo. La ruta continúa.</span>`);
}

async function cmd_ping(arg){
  const dest = "pablo.amador@gmail.com";
  print(`PING <span class="cyan">${dest}</span> (mail.contacto.net) 56(84) bytes of data.`);
  const replies = [
    `"Hola 👋"`,
    `"Cuéntame qué necesitas"`,
    `"Sí, respondo a los mensajes"`,
    `"Disponible para nuevos retos"`,
  ];
  for(let i=0;i<replies.length;i++){
    await sleep(420);
    const t = (0.2 + Math.random()*0.6).toFixed(3);
    print(`64 bytes from <span class="cyan">inbox</span>: icmp_seq=${i+1} ttl=64 time=<span class="amber">${t} ms</span>  <span class="dim">reply:</span> <span class="bright">${replies[i]}</span>`);
  }
  await sleep(300);
  print(``);
  print(`<span class="dim">--- ${dest} estadísticas de ping ---</span>`);
  print(`4 packets transmitted, 4 received, <span class="bright">0% packet loss</span>, time 1680ms`);
  print(`rtt min/avg/max = 0.214/0.431/0.792 ms`);
  print(``);
  print(`<span class="bright bold">Canales abiertos para contactar:</span>`);
  print(`   email    : <a href="mailto:${dest}">${dest}</a>`);
  print(`   linkedin : <a href="https://linkedin.com/in/pablorblanco" target="_blank" rel="noopener">linkedin.com/in/pablorblanco</a>`);
  print(``);
  print(`<span class="amber">Respuesta garantizada. Talk is cheap — escríbeme.</span>`);
}

async function cmd_skills(){
  print(`<span class="dim">$ pip list --installed</span>`);
  print(``);
  for(const [cat, items] of Object.entries(SKILLS)){
    print(`<span class="amber bold">${cat}</span>`);
    for(const it of items){

      print(`   <span class="bright">${it.padEnd(34," ")}</span><span class="dim">${ver}</span>`);

}

function cmd_help(){
  print(`<span class="bright bold">Comandos disponibles:</span>`);
  print(``);
  const rows = [
    ["whoami",     "quién soy — perfil y filosofía de trabajo"],
    ["traceroute", "mi trayectoria profesional, salto a salto"],

    ["skills",     "stack técnico instalado"],

}

function cmd_neofetch(){
  const logo = [
    "      .--.      ",
    "     |o_o |     ",

    "   (|     | )   ",

  const info = [
    `<span class="amber bold">pablo.amador@gmail.com</span>`,

    `<span class="cyan">Uptime</span>  : 26 años, 6 roles`,
    `<span class="cyan">Shell</span>   : /bin/resolver`,
    `<span class="cyan">CPU</span>     : IA + BI + Automatización`,

function cmd_history(){
  if(!history.length){ print(`<span class="dim">(historial vacío)</span>`); return; }
  history.forEach((h,i)=> print(`   ${String(i+1).padStart(3," ")}  ${esc(h)}`));
}

async function cmd_exit(){
  print(``);
  print(`<span class="dim">Cerrando sesión...</span>`);
  await sleep(500);
  print(`<span class="red">Connection to ${HOST} closed by foreign host.</span>`);
  print(``);
  print(`<span class="dim">Gracias por conectar. Pulsa cualquier tecla para reconectar.</span>`);
  inputline.classList.add("hidden");
  document.addEventListener("keydown", reconnect, { once:true });
  screen.addEventListener("click", reconnect, { once:true });
}
function reconnect(){
  out.innerHTML = "";
  booted = false;
  boot();
}

/* ---------- router ---------- */
async function run(raw){
  const line = raw.trim();
  if(line) { history.push(line); }
  histIdx = history.length;

  // eco del comando
  print(`<span class="prompt-host">${PS1}</span>${esc(raw)}`);

  if(!line){ return; }

  const [c, ...rest] = line.split(/\s+/);
  const arg = rest.join(" ");
  inputline.classList.add("hidden");

  switch(c.toLowerCase()){
    case "whoami":      await cmd_whoami(); break;
    case "traceroute":
    case "tracert":     await cmd_traceroute(arg); break;
    case "ping":        await cmd_ping(arg); break;
    case "skills":
    case "stack":       await cmd_skills(); break;
    case "neofetch":    cmd_neofetch(); break;
    case "help":
    case "?":
    case "man":         cmd_help(); break;
    case "history":     cmd_history(); break;
    case "banner":      await showBanner(); break;
    case "clear":
    case "cls":         out.innerHTML=""; break;
    case "exit":
    case "logout":
    case "quit":        await cmd_exit(); return;
    case "ls":          print(`<span class="cyan">whoami.txt  traceroute.log  ping.cfg  skills.json  README.md</span>`); break;
    case "cat":
      if(/readme/i.test(arg)){ await cmd_whoami(); }
      else print(`cat: ${esc(arg)||"?"}: usa 'help' para ver qué hay aquí`);
      break;
    case "sudo":        print(`<span class="red">pablo no está en el fichero sudoers. Este incidente será reportado.</span> <span class="dim">(es broma 😄)</span>`); break;
    case "date":        print(new Date().toString()); break;
    case "echo":        print(esc(arg)); break;
    default:
      print(`<span class="red">telnet: comando no reconocido: ${esc(c)}</span>`);
      print(`<span class="dim">Escribe '<span class="amber">help</span>' para ver los comandos disponibles.</span>`);
  }
  print("");
  showPrompt();
}

function showPrompt(){
  inputline.classList.remove("hidden");
  cmd.value="";
  cmd.focus();
  scrollDown();
}

/* ---------- banner + arranque ---------- */
async function showBanner(){
  const banner = [
` ____      _     ____   _       ___  `,
`|  _ \\    / \\   | __ ) | |     / _ \\ `,
`| |_) |  / _ \\  |  _ \\ | |    | | | |`,

``,
` ____   _         _     _   _   ____   ___  `,
`| __ ) | |       / \\   | \\ | | / ___| / _ \\ `,
`|  _ \\ | |      / _ \\  |  \\| || |    | | | |`,

  ];

  print(`<span class="dim">Escribe '<span class="amber">help</span>' para empezar. Prueba '<span class="amber">whoami</span>', '<span class="amber">traceroute</span>' y '<span class="amber">ping</span>'.</span>`);

async function boot(){
  inputline.classList.add("hidden");
  await type(`<span class="dim">telnet ${HOST} 23</span>`, 22);
  print(`Trying 92.46.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}...`);
  await sleep(350);
  print(`Connected to <span class="bright">${HOST}</span>.`);
  print(`Escape character is '^]'.`);
  await sleep(250);
  await progress(`<span class="dim">Negociando opciones telnet</span>`, 700);
  await progress(`<span class="dim">Autenticando sesión invitado </span>`, 650);
  print(``);
  print(`<span class="green-dim dim">Ubuntu 26.04 LTS (HumanOS) · curriculum-node-07</span>`);
  print(`<span class="dim">Last login: ${new Date().toUTCString()} from visitante</span>`);
  print(``);
  await showBanner();
  booted = true;
  showPrompt();
}

/* ---------- entrada de teclado ---------- */
cmd.addEventListener("keydown", async (e)=>{
  if(e.key === "Enter"){
    e.preventDefault();
    const v = cmd.value;
    await run(v);
  } else if(e.key === "ArrowUp"){
    e.preventDefault();
    if(history.length){ histIdx = Math.max(0, histIdx-1); cmd.value = history[histIdx]||""; moveCaretEnd(); }
  } else if(e.key === "ArrowDown"){
    e.preventDefault();
    if(history.length){ histIdx = Math.min(history.length, histIdx+1); cmd.value = history[histIdx]||""; moveCaretEnd(); }
  } else if(e.key === "Tab"){
    e.preventDefault();
    const all = ["whoami","traceroute","ping","skills","neofetch","history","banner","clear","help","exit","ls","cat README.md","date"];
    const m = all.filter(x=>x.startsWith(cmd.value.toLowerCase()));
    if(m.length===1) cmd.value = m[0];
    else if(m.length>1){ print(`<span class="prompt-host">${PS1}</span>${esc(cmd.value)}`); print(`<span class="dim">${m.join("   ")}</span>`); scrollDown(); }
  } else if((e.ctrlKey) && e.key.toLowerCase()==="l"){
    e.preventDefault(); out.innerHTML="";
  }
});
function moveCaretEnd(){ const v=cmd.value; cmd.value=""; cmd.value=v; }

// mantener foco
screen.addEventListener("click", ()=>{ if(!inputline.classList.contains("hidden")) cmd.focus(); });
window.addEventListener("load", boot);
</script>
</body>
